<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12060a"><title>ประวัติ</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main><h1>ประวัติการยืม-คืน</h1><div class="stats" id="s"></div><div id="t">กำลังโหลด...</div></main>
<script src="app.js"></script><script>
const m=guard('user');nav('History.html');const ST={pending:'รออนุมัติ',borrowed:'กำลังยืม',returned:'คืนแล้ว',rejected:'ไม่อนุมัติ',cancelled:'ยกเลิกแล้ว'},PG={pending:0,borrowed:.5,returned:1};
function draw(d){const r=d.filter(l=>l.uid==m.id).reverse(),n=s=>r.filter(l=>l.status==s).length;
$('#s').innerHTML=[['ทั้งหมด',r.length],['กำลังยืม',n('borrowed')],['คืนแล้ว',n('returned')]].map(([t,v])=>`<div class="card stat"><b data-n="${v}">0</b><span>${t}</span></div>`).join('');
document.querySelectorAll('.stat b').forEach(e=>countUp(e,+e.dataset.n));
$('#t').innerHTML=r.map((l,k)=>{const late=l.status=='borrowed'&&l.due<today(),noBar=['rejected','cancelled'].includes(l.status);
return `<article class="card tk" style="--d:${k*70}ms"><div class="tr"><div><b>${esc(l.item)}</b><p class="mut">เลขที่ ${l.no} · ยืม ${th(l.borrowDate)} · กำหนดคืน ${th(l.due)}${l.retDate?' · คืน '+th(l.retDate):''}</p></div><span class="tag ${l.status=='returned'?'ok':late?'bad':''}">${late?'เกินกำหนด':ST[l.status]||esc(l.status)}</span></div>${noBar?'':`<div class="sp2" data-pg="${PG[l.status]}"><span class="on">ขอยืม</span><span class="${l.status!='pending'?'on':''}">อนุมัติ</span><span class="${l.status=='returned'?'on':''}">คืนแล้ว</span></div>`}${l.status=='pending'?`<div style="margin-top:14px"><button class="btn g" onclick="cancelL('${l.no}',this)">ยกเลิกคำขอ</button></div>`:''}</article>`}).join('')||'<p class="mut">ยังไม่มีประวัติ ไปเลือกหนังสือเล่มแรกกันเลย</p>';
setTimeout(()=>document.querySelectorAll('.sp2').forEach(e=>e.style.setProperty('--pg',e.dataset.pg)),150)}
async function init(){draw((await load('loans',[])).d)}
async function cancelL(no,b){if(!confirm('ยกเลิกคำขอนี้?'))return;b.disabled=true;
try{await upd('loans',[],d=>{const x=d.find(y=>y.no==no&&y.uid==m.id);if(!x||x.status!='pending')throw Error('ยกเลิกไม่ได้ รายการนี้ถูกดำเนินการไปแล้ว');x.status='cancelled'});await init()}catch(e){alert(e.message);b.disabled=false;init().catch(()=>{})}}
init().catch(e=>$('#t').textContent=e.message);
</script></body></html>
