<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12060a"><title>ยืม-คืน</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.it{cursor:pointer}
.dm{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.dm.o{display:flex}
.dp{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;grid-template-columns:200px 1fr;gap:20px;padding:22px;border-radius:22px;background:rgba(28,11,18,.97);border:1px solid rgba(255,255,255,.12);color:#f6eeee;font-family:Prompt,sans-serif;box-shadow:0 40px 80px -24px #000}
.dc{aspect-ratio:3/4;border-radius:14px;background:var(--c);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;font-weight:600}
.dp h2{margin:0 0 10px;font-size:1.25rem}
.dp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:.92rem}
.dp dt{color:#b9a9ab}.dp dd{margin:0}
.dx{position:absolute;top:8px;right:14px;background:none;border:0;color:inherit;font-size:1.6rem;cursor:pointer;line-height:1}
@media(max-width:520px){.dp{grid-template-columns:1fr}.dc{max-width:200px;margin:0 auto}}
</style></head><body><main>
<section class="hero two"><div><small>ยินดีต้อนรับ</small><h1 id="hi"></h1><div class="pills" id="st"></div><div class="due"><input type="date" id="due" aria-label="วันที่ต้องการคืน"><span id="dueTh"></span></div></div>
<div class="b3w"><div class="b3"><i class="f">ห้องสมุด<br>วท.พัทลุง</i><i class="k"></i><i class="s"></i><i class="p"></i></div></div></section>
<div class="bar2"><input id="q" type="search" placeholder="ค้นหาชื่อรายการ"><div id="chips" class="tabs" style="margin:0"></div></div>
<div class="grid" id="g"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div></main>
<script src="app.js"></script><script>
const m=guard('user');nav('borrow.html');$('#hi').textContent=m.name;
$('#due').value=ymd(addDays(Math.min(7,CFG.maxDays)));$('#due').min=today();$('#due').max=ymd(addDays(CFG.maxDays));
const showDue=()=>$('#dueTh').textContent='คืนวันที่ '+th($('#due').value)+' (ยืมได้ไม่เกิน '+CFG.maxDays+' วัน · สูงสุด '+CFG.maxLoans+' เล่มพร้อมกัน)';$('#due').onchange=showDue;showDue();
let items=[],loans=[],cat='ทั้งหมด',q='';const pal=['#7a1626','#b3122d','#5a0f1b','#9b1c31','#44121c'],hs=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%5;
const left=i=>i.qty-loans.filter(l=>l.itemId==i.id&&['pending','borrowed'].includes(l.status)).length;
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)};
function draw(first){const mine=loans.filter(l=>l.uid==m.id),n=s=>mine.filter(l=>l.status==s).length;
$('#st').innerHTML=`<span class="pill">กำลังยืม <b class="n" data-n="${n('borrowed')}">0</b></span><span class="pill">รออนุมัติ <b class="n" data-n="${n('pending')}">0</b></span>`;
document.querySelectorAll('.n').forEach(e=>countUp(e,+e.dataset.n));
const cats=['ทั้งหมด',...new Set(items.map(i=>i.type).filter(Boolean))];
$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});
const L=items.filter(i=>(cat=='ทั้งหมด'||i.type==cat)&&(i.title+' '+(i.pub||'')).toLowerCase().includes(q));
$('#g').innerHTML=L.map((i,k)=>{const l=left(i),p=Math.max(0,Math.round(l/i.qty*100)),bg=typeof i.img=='string'&&i.img.startsWith('data:image/')?`;background-image:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.1)),url('${i.img}');background-size:cover;background-position:center`:'',info=[i.pub,i.year&&'พ.ศ. '+i.year].filter(Boolean).map(esc).join(' · ');
return `<article class="card it" data-tilt style="--d:${k*60}ms" onclick="det('${i.id}')"><div class="cv" style="--c:${pal[hs(i.title)]}${bg}"><b>${esc(i.title)}</b><small>${esc(i.type||'ทั่วไป')}</small></div><div class="bar"><i style="width:${p}%"></i></div>${info?`<div class="meta">${info}</div>`:''}<div class="meta">เหลือ ${l} จาก ${i.qty}</div><button class="btn full" ${l<1?'disabled':''} data-bid="${i.id}" onclick="event.stopPropagation();req('${i.id}',this)">${ic('plus')}${l<1?'หมดชั่วคราว':'ขอยืม'}</button></article>`}).join('')||'<p class="mut">ไม่พบรายการ</p>'}
const okImg=v=>typeof v=='string'&&v.startsWith('data:image/');
const dm=document.createElement('div');dm.className='dm';document.body.append(dm);
const closeD=()=>dm.classList.remove('o');
dm.onclick=e=>{if(e.target==dm)closeD()};addEventListener('keydown',e=>e.key=='Escape'&&closeD());
function det(id){const i=items.find(x=>x.id==id);if(!i)return;
const l=left(i),have=loans.some(x=>x.uid==m.id&&x.itemId==i.id&&['pending','borrowed'].includes(x.status)),
cv=okImg(i.img)?`background-image:url('${i.img}')`:`--c:${pal[hs(i.title)]}`,
R=[['ประเภท',i.type||'ทั่วไป'],['สำนักพิมพ์',i.pub],['ปีที่พิมพ์',i.year&&'พ.ศ. '+i.year],['คงเหลือ',`${l} จาก ${i.qty} เล่ม`]].filter(r=>r[1]);
dm.innerHTML=`<div class="dp" role="dialog" aria-modal="true" aria-label="${esc(i.title)}"><button class="dx" aria-label="ปิด" onclick="closeD()">×</button><div class="dc" style="${cv}">${okImg(i.img)?'':esc(i.title)}</div><div><h2>${esc(i.title)}</h2><dl>${R.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${have?'<p class="mut">คุณมีคำขอหรือกำลังยืมรายการนี้อยู่แล้ว</p>':''}<div class="mut" style="margin-bottom:10px">คืนวันที่ ${th($('#due').value)}</div><button class="btn full" ${l<1?'disabled':''} onclick="reqD('${i.id}')">${ic('plus')}${l<1?'หมดชั่วคราว':'ขอยืม'}</button></div></div>`;
dm.classList.add('o')}
function reqD(id){const b=document.querySelector(`#g [data-bid="${id}"]`);closeD();if(b)req(id,b)}
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
async function init(){[items,loans]=(await Promise.all([load('books',[]),load('loans',[])])).map(x=>x.d);draw()}
async function req(id,b){const i=items.find(x=>x.id==id);if(!i)return;b.disabled=true;
try{const due=$('#due').value;if(!due||due<today()||due>ymd(addDays(CFG.maxDays)))throw Error('เลือกวันคืนไม่เกิน '+CFG.maxDays+' วันนับจากวันนี้');
const [u,bk]=await Promise.all([load('users',{}).then(r=>r.d[m.id]),load('books',[]).then(r=>r.d.find(x=>x.id==id))]);
if(!u){sessionStorage.clear();alert('ไม่พบบัญชีของคุณในระบบ (อาจถูกลบ) กรุณาสมัครใหม่');location.href='login.html';return}
if(!bk)throw Error('ไม่พบหนังสือเล่มนี้แล้ว');
await upd('loans',[],d=>{const act=d.filter(l=>['pending','borrowed'].includes(l.status));
if(act.some(l=>l.uid==m.id&&l.itemId==id))throw Error('คุณมีคำขอหรือกำลังยืมเล่มนี้อยู่แล้ว');
if(act.filter(l=>l.uid==m.id).length>=CFG.maxLoans)throw Error('ยืมพร้อมกันได้สูงสุด '+CFG.maxLoans+' เล่ม');
if(act.filter(l=>l.itemId==id).length>=bk.qty)throw Error('เล่มนี้ถูกยืมหรือจองครบแล้ว');
const n=Math.max(0,...d.map(l=>+String(l.no).slice(1)||0))+1;
d.push({no:'L'+String(n).padStart(4,'0'),uid:m.id,name:u.first+' '+u.last,level:u.level,group:u.group,dept:u.dept,major:u.major,item:bk.title,itemId:bk.id,borrowDate:today(),due,status:'pending'})});
flyBook(b,document.querySelector('.top a[href="History.html"]'));toast('ส่งคำขอแล้ว รอแอดมินอนุมัติ');await init()}catch(e){toast(e.message);b.disabled=false;init().catch(()=>{})}}
init().catch(e=>$('#g').textContent=e.message);
</script></body></html>
